services:
  postgres:
    image: postgres:16-alpine
    container_name: vigia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vigia
      POSTGRES_USER: vigia
      POSTGRES_PASSWORD: vigia
    ports:
      - "5432:5432"
    volumes:
      - vigia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigia -d vigia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vigia_postgres_data:

